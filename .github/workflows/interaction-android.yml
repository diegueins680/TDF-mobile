name: Interaction Android test build
on:
  pull_request:
    paths:
      - '.github/workflows/interaction-android.yml'
      - 'src/**'
      - 'app/**'
      - 'android/**'
      - 'package-lock.json'
      - 'e2e/ci/**'
      - 'scripts/run-native-ui-smoke.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: interaction-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_BASE: http://127.0.0.1:18128
      EXPO_PUBLIC_UPLOAD_URL: http://127.0.0.1:18128/drive/upload
      NODE_ENV: production
      ANDROID_AVD_HOME: ${{ runner.temp }}/tdf-ci-avd
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Initialize UI evidence as not run
        run: python3 scripts/run-native-ui-smoke.py android --initialize --evidence "$RUNNER_TEMP/tdf-ui-android"
      - name: Grant temporary KVM access to the hosted runner
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -c /dev/kvm
          command -v getfacl
          command -v setfacl
          getfacl -p /dev/kvm > "$RUNNER_TEMP/tdf-kvm-original.acl"
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Require existing KVM access before building
        run: |
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::KVM is unavailable to this runner; native UI was not executed."
            id
            ls -l /dev/kvm || true
            exit 1
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --include=dev
      - name: Isolate emulator build from production and OTA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          p=Path('android/app/src/main/AndroidManifest.xml')
          E.register_namespace('android','http://schemas.android.com/apk/res/android')
          tree=E.parse(p); app=tree.getroot().find('application'); key='{http://schemas.android.com/apk/res/android}'
          # This disposable test APK uses adb reverse to reach the local fixture.
          app.set(key+'usesCleartextTraffic','true')
          for item in app.findall('meta-data'):
              if item.get(key+'name')=='expo.modules.updates.ENABLED': item.set(key+'value','false')
          tree.write(p,encoding='utf-8',xml_declaration=True)
          PY
      - name: Add isolated Detox instrumentation to the test build
        run: |
          printf '\napply from: "../../e2e/ci/android.gradle"\n' >> android/app/build.gradle
      - name: Build bundled test APK with the repository debug test key
        working-directory: android
        run: ./gradlew :app:assembleRelease :app:assembleAndroidTest -DtestBuildType=release --no-daemon --max-workers=2 -PreactNativeArchitectures=x86_64 '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: interaction-android-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 3
      - name: Install emulator image using existing runner licenses
        run: |
          test -r /dev/kvm
          test -w /dev/kvm
          test -s "$ANDROID_HOME/licenses/android-sdk-license"
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'emulator' 'system-images;android-36;default;x86_64' </dev/null
      - name: Boot Android and execute isolated UI smoke
        run: python3 scripts/run-native-ui-smoke.py android --evidence "$RUNNER_TEMP/tdf-ui-android"
      - name: Retain Android UI evidence including failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-ui-android-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tdf-ui-android
          if-no-files-found: error
          retention-days: 3
      - name: Restore original KVM permissions
        if: always()
        run: |
          set -euo pipefail
          if [ -s "$RUNNER_TEMP/tdf-kvm-original.acl" ]; then
            sudo setfacl --restore="$RUNNER_TEMP/tdf-kvm-original.acl"
          fi
