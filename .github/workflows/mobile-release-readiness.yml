name: Mobile Release Readiness

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Optional EAS build target
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: EAS profile to validate or build
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
      start_eas_build:
        description: Start a cloud build after the readiness checks pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    env:
      CI: true
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache
      npm_config_cache: ${{ github.workspace }}/.npm-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: .npm-cache
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run release readiness checks
        run: npm run release:check

      - name: Run tests
        run: npm test

      - name: Run Expo doctor
        run: npx expo-doctor

      - name: Report missing EXPO_TOKEN
        if: ${{ inputs.start_eas_build && secrets.EXPO_TOKEN == '' }}
        run: echo "Skipping EAS build because EXPO_TOKEN is not configured for this repository."

      - name: Verify EAS authentication
        if: ${{ inputs.start_eas_build && secrets.EXPO_TOKEN != '' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest whoami

      - name: Start Android EAS build
        if: ${{ inputs.start_eas_build && secrets.EXPO_TOKEN != '' && (inputs.platform == 'all' || inputs.platform == 'android') }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait

      - name: Start iOS EAS build
        if: ${{ inputs.start_eas_build && secrets.EXPO_TOKEN != '' && (inputs.platform == 'all' || inputs.platform == 'ios') }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform ios --profile ${{ inputs.profile }} --non-interactive --no-wait
