# Run through the isolated backend fixture runner, never against production.
appId: ${APP_ID || "com.tdfrecords.app"}
---
- launchApp:
    clearState: true
- openLink:
    link: "tdf://auth"
    autoVerify: true
- tapOn:
    text: "^Open$"
    optional: true
- runFlow:
    when:
      notVisible:
        id: usernameInput
    commands:
      - tapOn: "^Cerrar sesión$|^Sign out$"
- extendedWaitUntil:
    visible:
      id: usernameInput
    timeout: 30000
- tapOn:
    id: usernameInput
- waitForAnimationToEnd
- tapOn:
    id: usernameInput
- inputText: ${TDF_USERNAME}
- assertVisible: ${TDF_USERNAME}
- tapOn:
    id: passwordInput
- inputText: ${TDF_PASSWORD}
- pressKey: Enter
- extendedWaitUntil:
    notVisible:
      id: usernameInput
    timeout: 120000
- openLink:
    link: "tdf://conversacion/target/${TDF_TARGET_ID}"
    autoVerify: true
- extendedWaitUntil:
    visible: "API publication"
    timeout: 30000
- tapOn: "Me gusta:.*"
- tapOn:
    text: "Escribe un comentario"
    index: 1
- inputText: ${TDF_COMMENT_BODY}
- tapOn: "API publication"
- scrollUntilVisible:
    element: "^Publicar$"
    direction: DOWN
    timeout: 30000
- tapOn: "^Publicar$"
- extendedWaitUntil:
    visible: ${TDF_COMMENT_BODY}
    timeout: 30000
- takeScreenshot: /tmp/tdf-interaction-native-created
